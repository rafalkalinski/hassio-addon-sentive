<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentive OPS — Set PIN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f3f4f6;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 0.35rem;
      text-align: center;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .error {
      margin-bottom: 1rem;
      padding: 0.6rem 0.875rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      color: #dc2626;
      font-size: 0.8rem;
    }
    .field { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      color: #111827;
      font-size: 1.6rem;
      letter-spacing: 0.5em;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: #fff;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Sentive OPS</div>
    <div class="subtitle">Choose a 4-digit PIN to protect this panel</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label for="pin">New PIN</label>
        <input
          type="password"
          id="pin"
          name="pin"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]{4}"
          autocomplete="new-password"
          autofocus
          required
        >
      </div>
      <div class="field">
        <label for="confirm_pin">Confirm PIN</label>
        <input
          type="password"
          id="confirm_pin"
          name="confirm_pin"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]{4}"
          autocomplete="new-password"
          required
        >
      </div>
      <button type="submit">Set PIN and Continue</button>
    </form>
    <p class="hint">PIN is stored locally on this device. If you forget it, reset the add-on data.</p>
  </div>
</body>
</html>
