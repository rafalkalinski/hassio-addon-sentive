<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentive OPS — Enter PIN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f3f4f6;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      text-align: left;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      color: #111827;
      font-size: 1.6rem;
      letter-spacing: 0.5em;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: #fff;
    }
    .error {
      margin-top: 0.75rem;
      padding: 0.6rem 0.875rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      color: #dc2626;
      font-size: 0.8rem;
      text-align: left;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Sentive OPS</div>
    <div class="subtitle">Enter your 4-digit PIN to continue</div>
    <form method="POST">
      <label for="pin">PIN</label>
      <input
        type="password"
        id="pin"
        name="pin"
        maxlength="4"
        inputmode="numeric"
        pattern="[0-9]{4}"
        autocomplete="current-password"
        autofocus
        required
      >
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
